    let 弹幕区域 = document.getElementById('弹幕区域');
    function 发送弹幕(内容) {
      const 弹幕 = document.createElement('span');
      弹幕.textContent = 内容;
      if (window.innerWidth < window.innerHeight * 0.8) {
        弹幕.className = '弹幕上下';
        弹幕.style.left = `${Math.random() * 100}%`;

      } else {
        弹幕.className = '弹幕左右';
        弹幕.style.top = `${Math.random() * 100}%`;

      }


      弹幕区域.appendChild(弹幕);



      弹幕.addEventListener('animationend', () => {
        弹幕.remove();
      });
    }
    setInterval(() => {
      if (弹幕隐藏) { return }
      const 随机内容 = 数据[Math.floor(Math.random() * 数据.length)];
      发送弹幕(随机内容);
    }, 1000);

    document.addEventListener('visibilitychange', () => { 弹幕状态更新(document.hidden) });
    let 弹幕隐藏 = true;
    function 弹幕状态更新(a) {
      弹幕隐藏 = a
      if (a) {
        for (const element of 弹幕区域.children) {
          const animation = element.getAnimations()[0];
          if (animation) {
            animation.pause();
          }
        }

      } else {
        for (const element of 弹幕区域.children) {
          const animation = element.getAnimations()[0];
          if (animation) {
            animation.play();
          }
        }

      }
    }
  </script>

  <script>
    let 是太阳 = true
    let 切换完成 = true
    function 显示切换() {
      是太阳 = !是太阳
      切换完成 = false
      let a1 = document.getElementById('显示切换').children
      if (是太阳) {
        a(a1[1], a1[0])
      } else {
        a(a1[0], a1[1])
      }
      function a(b, c) {
        b.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: 200, fill: 'forwards', easing: 'ease-in' })
          .onfinish = () => {
            内容切换()
            c.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 200, fill: 'forwards', easing: 'ease-out' })
              .onfinish = () => {
                切换完成 = true
              }
          }
      }
    }

    内容切换()
    function 内容切换() {
      let a = document.getElementById('简历内容')
      if (是太阳) {
        let 有重要文本 = false
        for (let i = a.children.length - 1; i >= 0; i--) {
          let b = a.children[i]
          switch (b.tagName) {
            case 'H1':
              if (有重要文本) {
                有重要文本 = false
              } else {
                b.style.animation = '内容隐藏 1s forwards'
              }
              break;
            case 'P':
              if (b.hasAttribute('重要')) {
                有重要文本 = true
              } else {
                b.style.animation = '内容隐藏 1s forwards'
              }
              break;
          }
        }
      } else {
        for (let i = a.children.length - 1; i >= 0; i--) {
          a.children[i].style.animation = '内容出现 1s forwards'
        }

      }

    }
  </script>

  <script>
    const parentScroll = document.getElementById('主滚动区域');
    const childScroll = document.getElementById('内容滚动区域');
    let 滚动对象组 = [parentScroll, childScroll];
    let 滚动对象序号 = 0;
    let 滚动距离 = 0;
    let 上帧时间 = performance.now();
    let 正在滚动 = false;

    function 滚动() {

      const now = performance.now();
      let a = (now - 上帧时间) * 0.001

      if (a == 0) {
        requestAnimationFrame(滚动);
        return
      }

      let b = Math.floor(Math.min(Math.abs(10 * 滚动距离 * a), Math.abs(滚动距离))) * Math.sign(滚动距离)
      if (b == 0) {
        if (Math.abs(滚动距离) < 1) {
          正在滚动 = false
          滚动距离 = 0
        } else {
          requestAnimationFrame(滚动)
        }
        return
      }

      上帧时间 = now;
      滚动距离 -= b
      if (滚动对象序号 == 0) {
        let a = parentScroll.scrollTop + b - (parentScroll.scrollHeight - parentScroll.clientHeight)
        if (a >= 0) {
          弹幕状态更新(true)
          滚动对象序号 = 1;
          childScroll.scrollTop += a;
        }
        parentScroll.scrollTop += b;
        弹幕区域.style.opacity = 1 - parentScroll.scrollTop / (parentScroll.scrollHeight - parentScroll.clientHeight)
      } else if (滚动对象序号 == 1) {
        let a = childScroll.scrollTop + b;
        if (a <= 0) {
          弹幕状态更新(false)
          滚动对象序号 = 0;
          parentScroll.scrollTop += a;
        }
        childScroll.scrollTop += b;
      }
      requestAnimationFrame(滚动)

    }




    [parentScroll, childScroll].forEach(scrollElement => {
      scrollElement.addEventListener('wheel', scrollInterceptor, { passive: false });


      scrollElement.addEventListener('touchmove', 触屏移动, { passive: false });
      scrollElement.addEventListener('touchstart', 触屏按下, { passive: true });
      scrollElement.addEventListener('touchend', 触屏松开, { passive: true });

      scrollElement.addEventListener('mousedown', 鼠标按下, { passive: false });

    });
    document.addEventListener('mouseup', 鼠标松开);

    function scrollInterceptor(e) {
      e.preventDefault();
      e.stopPropagation();
      滚动值变化(e.deltaY)

    }



    function 触屏按下(e) {
      // e.preventDefault();
      e.stopPropagation();
      const element = e.currentTarget;
      element._lastTouchY = e.touches[0].clientY;
    }
    function 触屏松开(e) {
      // e.preventDefault();
      e.stopPropagation();
      const element = e.currentTarget;
      element._lastTouchY = null;
    }
    function 触屏移动(e) {
      e.preventDefault();
      e.stopPropagation();
      if (e.touches.length > 1) {
        return;
      }
      const element = e.currentTarget;
      const touch = e.touches[0];
      const currentY = touch.clientY;
      滚动值变化((element._lastTouchY || currentY) - currentY)
      element._lastTouchY = currentY;
    }




    function 鼠标按下(e) {
      e.preventDefault();
      e.stopPropagation();
      if (e.button !== 0) return;

      const element = e.currentTarget;
      element._鼠标 = e.clientY;
      document.addEventListener('mousemove', 鼠标移动);

    }
    function 鼠标松开(e) {
      e.preventDefault();
      e.stopPropagation();
      const element = e.currentTarget;
      element._鼠标 = null;
      document.removeEventListener('mousemove', 鼠标移动);
    }
    function 鼠标移动(e) {
      e.preventDefault();
      e.stopPropagation();
      const element = e.currentTarget;
      const currentY = e.clientY;
      滚动值变化((element._鼠标 || currentY) - currentY)
      element._鼠标 = currentY;
    }


    function 滚动值变化(a) {
      滚动距离 += a * 1.2;
      if (Math.abs(滚动距离) >= 1 && !正在滚动) {
        正在滚动 = true;
        requestAnimationFrame(function () {
          上帧时间 = performance.now();
          滚动();
        });
      }
    }
  </script>
